  LOGIN_REQUEST = 1001;
  LOGIN_RESPONSE = 1002;
  LOGOUT_NOTIFICATION = 1003;
  HEARTBEAT_PING = 1010;
  HEARTBEAT_PONG = 1011;
  DIRECT_MESSAGE_SEND = 2001;
  GROUP_MESSAGE_SEND = 2002;
  DIRECT_MESSAGE_PUSH = 2003;
  MESSAGE_ACK = 2010;
  DELIVERY_RECEIPT = 2011;
  READ_RECEIPT = 2012;
  MESSAGE_RECALL = 2013;
  MESSAGE_SYNC_REQUEST = 2020;
  MESSAGE_SYNC_RESPONSE = 2021;
  PRESENCE_UPDATE = 3001;
  CONFERENCE_JOIN_REQUEST = 3501;
  CONFERENCE_JOIN_RESPONSE = 3502;
  CONFERENCE_LEAVE_REQUEST = 3503;
  CONFERENCE_LEAVE_RESPONSE = 3504;
  FILE_UPLOAD_REQUEST = 4001;
  FILE_UPLOAD_RESPONSE = 4002;
  FILE_DOWNLOAD_REQUEST = 4003;
  FILE_DOWNLOAD_RESPONSE = 4004;
  FILE_TRANSFER_COMPLETE = 4005;
  ORGANIZATION_SNAPSHOT_REQUEST = 5001;
  ORGANIZATION_SNAPSHOT_RESPONSE = 5002;
  ORGANIZATION_DELTA_REQUEST = 5003;
  ORGANIZATION_DELTA_RESPONSE = 5004;
