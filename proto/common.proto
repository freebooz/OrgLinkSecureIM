  GROUP_CREATE_REQUEST = 6105;
  GROUP_CREATE_RESPONSE = 6106;
  GROUP_JOIN_REQUEST = 6107;
  GROUP_JOIN_RESPONSE = 6108;
  GROUP_MEMBER_UPDATE_REQUEST = 6109;
  GROUP_MEMBER_UPDATE_RESPONSE = 6110;
  NOTIFICATION_LIST_REQUEST = 6201;
  NOTIFICATION_LIST_RESPONSE = 6202;
  NOTIFICATION_DETAIL_REQUEST = 6203;
  NOTIFICATION_DETAIL_RESPONSE = 6204;
  NOTIFICATION_STATUS_REQUEST = 6205;
  NOTIFICATION_STATUS_RESPONSE = 6206;
  NOTIFICATION_MARK_ALL_READ_REQUEST = 6207;
  NOTIFICATION_MARK_ALL_READ_RESPONSE = 6208;
  SETTINGS_GET_REQUEST = 6301;
