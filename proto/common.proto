// 请求上下文关联登录设备、幂等键和链路追踪；服务端不得信任客户端上报的权限字段。
message RequestContext {
  string request_id = 1;
  uint64 user_account_id = 2;
  uint64 person_id = 3;
  uint64 device_id = 4;
  int64 client_time_utc_ms = 5;
  string idempotency_key = 6;
  string trace_id = 7;
}

// 统一错误只暴露稳定错误码和可本地化提示键，内部异常与 SQL 不返回客户端。
message ErrorStatus {
  uint32 code = 1;
  string message_key = 2;
  string correlation_id = 3;
  map<string, string> safe_details = 4;
}
