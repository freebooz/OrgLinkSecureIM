  PERSON_SEARCH_REQUEST = 5009;
  PERSON_SEARCH_RESPONSE = 5010;
  PERSON_DETAIL_REQUEST = 5011;
  PERSON_DETAIL_RESPONSE = 5012;
  PERSON_PRESENCE_UPDATE = 5013;
  FAVORITE_CONTACT_ADD = 5014;
  FAVORITE_CONTACT_REMOVE = 5015;
  DIRECT_CONVERSATION_GET_OR_CREATE = 5016;
  DIRECT_CONVERSATION_RESPONSE = 5017;
  GROUP_CREATE_FROM_PERSONS = 5018;
  ORGANIZATION_CHANGE_NOTIFICATION = 5019;
  CONVERSATION_LIST_REQUEST = 5020;
  CONVERSATION_LIST_RESPONSE = 5021;
  CONVERSATION_PREFERENCE_REQUEST = 5022;
