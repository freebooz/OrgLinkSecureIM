<main class="login-page">
  <div class="login-layout">
    <section class="brand-panel" aria-labelledby="brand-title">
      <header class="brand-lockup">
        <span class="brand-shield" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M32 4 56 13v16c0 14.5-10 25.5-24 31C18 54.5 8 43.5 8 29V13z"/><path d="m19 33 8 8 18-22"/></svg>
        </span>
        <span class="brand-name"><strong>安信通</strong><small>OrgLink Secure IM</small></span>
      </header>

      <div class="brand-copy">
        <p class="eyebrow">企业级安全协同平台</p>
        <h1 id="brand-title">统一管理组织、人员<br />与共享文件</h1>
        <p class="brand-description">以组织架构为基座，集中管理成员、账号权限和共享文件，让每一次管理操作都可追溯、可审计。</p>

        <ul class="feature-list" aria-label="平台能力">
          <li><app-icon name="organization"></app-icon><span><b>组织架构</b><small>部门、岗位与修订记录</small></span></li>
          <li><app-icon name="people"></app-icon><span><b>人员与账号</b><small>身份、状态与权限分离</small></span></li>
          <li><app-icon name="files"></app-icon><span><b>共享文件</b><small>文件对象与访问关系管控</small></span></li>
        </ul>
      </div>

      <footer>安信通管理控制台 · 安全连接组织，高效协同沟通</footer>
    </section>

    <section class="login-panel" aria-label="管理控制台登录">
      <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
        <span class="login-icon" aria-hidden="true"><app-icon name="shield"></app-icon></span>
        <p class="card-kicker">安信通管理控制台</p>
        <h2>欢迎登录</h2>
        <p class="card-description">请输入管理员账号信息</p>

        @if (errorMessage()) { <div class="login-error" role="alert">{{ errorMessage() }}</div> }

        <div class="field">
          <label for="login-name">管理员账号</label>
          <input id="login-name" formControlName="loginName" autocomplete="username" placeholder="请输入管理员账号" />
        </div>
        <div class="field password-field">
          <label for="password">密码</label>
          <input id="password" formControlName="password" [type]="passwordVisible() ? 'text' : 'password'" autocomplete="current-password" placeholder="请输入密码" />
          <button type="button" class="password-toggle" (click)="passwordVisible.set(!passwordVisible())">{{ passwordVisible() ? '隐藏' : '显示' }}</button>
        </div>

        <button class="primary-button login-button" type="submit" [disabled]="auth.busy()">
          {{ auth.busy() ? '正在安全校验…' : '登录管理控制台' }}
        </button>

        <div class="security-row" aria-label="安全能力说明">
          <span><i></i>TLS 加密连接</span><span><i></i>CSRF 防护</span><span><i></i>操作审计</span>
        </div>
      </form>
      <p class="login-hint">仅限已授予管理员角色的组织成员访问</p>
    </section>
  </div>
</main>
