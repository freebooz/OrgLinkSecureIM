server {
    listen 8444 ssl;
    server_name _;

    ssl_certificate /etc/orglink/tls/server.crt;
    ssl_certificate_key /etc/orglink/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"orglink-admin-web"}';
    }

    # 浏览器只访问同源 /api；管理员 Cookie、CSRF 和真实来源地址都由这一层转发。
    location /api/ {
        proxy_pass http://orglink-admin-api:7080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
