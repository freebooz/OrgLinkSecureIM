server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 会议 JWT 只放在 URL fragment 中，不会进入 Nginx 请求行；仍禁止页面被其他站点嵌入。
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
