server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/orglink/tls/server.crt;
    ssl_certificate_key /etc/orglink/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /usr/share/nginx/html;
    index index.html;

    # 会议 JWT 只放在 URL fragment 中，不会进入 Nginx 请求行；仍禁止页面被其他站点嵌入。
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # LiveKit 信令与会议页面共用 HTTPS 源，避免浏览器阻止混合内容并确保 getUserMedia 可用。
    location /livekit {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
